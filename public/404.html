<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>3DPrinter4You</title>
    <script>
      // Redirecionamento SPA para GitHub Pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/' +
          (l.hash ? l.hash : '#/')
      );
    </script>
  </head>
  <body></body>
</html>
